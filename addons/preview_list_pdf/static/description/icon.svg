<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00a5cf;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f2fe;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="70" cy="70" r="65" fill="url(#bg)" />
  
  <!-- Document shape -->
  <g transform="translate(35, 25)">
    <!-- Main document body -->
    <rect x="0" y="10" width="60" height="75" rx="4" fill="url(#docGrad)" stroke="#0891b2" stroke-width="1.5"/>
    
    <!-- Folded corner -->
    <polygon points="45,10 60,10 60,25 45,25" fill="#cffafe" stroke="#0891b2" stroke-width="1.5"/>
    <polygon points="45,10 60,10 60,25 45,25" fill="#e0f2fe"/>
    <line x1="45" y1="10" x2="60" y2="25" stroke="#0891b2" stroke-width="1.5"/>
    
    <!-- Text lines -->
    <rect x="10" y="30" width="35" height="4" rx="2" fill="#0891b2" opacity="0.7"/>
    <rect x="10" y="40" width="30" height="3" rx="1.5" fill="#00a5cf" opacity="0.5"/>
    <rect x="10" y="48" width="28" height="3" rx="1.5" fill="#00a5cf" opacity="0.4"/>
    <rect x="10" y="56" width="32" height="3" rx="1.5" fill="#00a5cf" opacity="0.5"/>
    <rect x="10" y="64" width="25" height="3" rx="1.5" fill="#00a5cf" opacity="0.3"/>
    
    <!-- PDF label -->
    <rect x="12" y="72" width="18" height="8" rx="2" fill="#dc2626" opacity="0.9"/>
    <text x="21" y="79" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="white" text-anchor="middle">PDF</text>
  </g>
  
  <!-- Spinning arc (subtle loading indicator) -->
  <circle cx="70" cy="70" r="68" fill="none" stroke="#00a5cf" stroke-width="3" stroke-dasharray="100 300" stroke-linecap="round" opacity="0.4">
    <animateTransform attributeName="transform" type="rotate" from="0 70 70" to="360 70 70" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>