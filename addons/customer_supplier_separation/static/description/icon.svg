<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <!-- Customer card gradient -->
    <linearGradient id="customerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <!-- Supplier card gradient -->
    <linearGradient id="supplierGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fef3c7;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#00000022"/>
    </filter>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="10" y="10" width="120" height="120" rx="24" fill="url(#bgGrad)" />
  
  <!-- Subtle pattern dots -->
  <circle cx="25" cy="25" r="1.5" fill="white" opacity="0.15"/>
  <circle cx="40" cy="20" r="1" fill="white" opacity="0.1"/>
  <circle cx="115" cy="30" r="1.5" fill="white" opacity="0.15"/>
  <circle cx="120" cy="110" r="1" fill="white" opacity="0.1"/>
  <circle cx="25" cy="110" r="1" fill="white" opacity="0.1"/>
  
  <!-- Customer Card (Left) -->
  <g transform="translate(28, 38)">
    <!-- Card background -->
    <rect x="0" y="0" width="36" height="48" rx="6" fill="url(#customerGrad)" filter="url(#shadow)" stroke="#818cf8" stroke-width="1"/>
    
    <!-- Person icon -->
    <circle cx="18" cy="16" r="7" fill="#6366f1" opacity="0.15"/>
    <circle cx="18" cy="14" r="4.5" fill="#6366f1"/>
    <ellipse cx="18" cy="26" rx="7" ry="4" fill="#6366f1"/>
    
    <!-- Card label -->
    <text x="18" y="40" font-family="Arial, sans-serif" font-size="6" font-weight="600" fill="#4f46e5" text-anchor="middle">CUSTOMER</text>
  </g>
  
  <!-- Supplier Card (Right) -->
  <g transform="translate(76, 38)">
    <!-- Card background -->
    <rect x="0" y="0" width="36" height="48" rx="6" fill="url(#supplierGrad)" filter="url(#shadow)" stroke="#fbbf24" stroke-width="1"/>
    
    <!-- Box/truck icon -->
    <rect x="10" y="14" width="16" height="12" rx="2" fill="#f59e0b" opacity="0.2"/>
    <rect x="10" y="14" width="16" height="12" rx="2" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <rect x="12" y="10" width="8" height="6" rx="1" fill="#f59e0b" opacity="0.2"/>
    <rect x="12" y="10" width="8" height="6" rx="1" fill="none" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="13" cy="28" r="2" fill="#f59e0b"/>
    <circle cx="23" cy="28" r="2" fill="#f59e0b"/>
    
    <!-- Card label -->
    <text x="18" y="40" font-family="Arial, sans-serif" font-size="5.5" font-weight="600" fill="#d97706" text-anchor="middle">SUPPLIER</text>
  </g>
  
  <!-- Divider arrow between cards -->
  <g transform="translate(64, 50)">
    <line x1="0" y1="0" x2="0" y2="24" stroke="white" stroke-width="1.5" opacity="0.4"/>
    <polygon points="-4,18 0,24 4,18" fill="white" opacity="0.4"/>
  </g>
  
  <!-- Separation line -->
  <line x1="38" y1="95" x2="102" y2="95" stroke="white" stroke-width="1.5" opacity="0.2"/>
  
  <!-- Bottom text -->
  <text x="70" y="112" font-family="Arial, sans-serif" font-size="7" font-weight="600" fill="white" text-anchor="middle" opacity="0.7">SEPARATION</text>
</svg>