<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f34d4d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="userGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee2e2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="70" cy="70" r="65" fill="url(#bgGrad)" />
  
  <!-- User icon 1 -->
  <g transform="translate(30, 25)">
    <circle cx="20" cy="15" r="10" fill="url(#userGrad)" stroke="#dc2626" stroke-width="1.5"/>
    <ellipse cx="20" cy="42" rx="18" ry="12" fill="url(#userGrad)" stroke="#dc2626" stroke-width="1.5"/>
  </g>
  
  <!-- User icon 2 (overlapping) -->
  <g transform="translate(55, 25)">
    <circle cx="20" cy="15" r="10" fill="url(#userGrad)" stroke="#dc2626" stroke-width="1.5"/>
    <ellipse cx="20" cy="42" rx="18" ry="12" fill="url(#userGrad)" stroke="#dc2626" stroke-width="1.5"/>
  </g>
  
  <!-- "Not equal" / block symbol -->
  <g transform="translate(70, 70)">
    <circle cx="0" cy="0" r="22" fill="#dc2626" stroke="white" stroke-width="2"/>
    <line x1="-10" y1="-10" x2="10" y2="10" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>